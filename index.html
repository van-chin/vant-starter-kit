<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 状态栏颜色：JS 运行时动态切换（浅色 #fff / 深色 #111） -->
    <meta name="theme-color" content="#ffffff" />
    <!-- 系统级深色模式预判：JS 加载前减少白闪 -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <!-- iOS PWA 状态栏：black-translucent 让内容延伸到状态栏下方（CSS safe-area 兜底） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- ─── SEO / Meta 标签（静态兜底，运行时由 @unhead/vue 动态接管） ─── -->
    <meta name="description" content="基于 Vue 3 + Vant 4 的移动端 H5 / PWA 快速启动模板，支持 App Shell 布局、深色模式、国际化" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="vant-starter-kit" />
    <meta property="og:description" content="基于 Vue 3 + Vant 4 的移动端 H5 / PWA 快速启动模板" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="vant-starter-kit" />
    <meta name="twitter:description" content="基于 Vue 3 + Vant 4 的移动端 H5 / PWA 快速启动模板" />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    <title>vant-starter-kit</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
