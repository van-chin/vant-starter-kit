name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

concurrency:
  group: deploy
  cancel-in-progress: false # 防止并发部署竞争

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-vp：安装 Vite+、匹配 .node-version 的 Node.js 并自动缓存依赖
      # （与 ci.yml 保持一致，统一使用 Vite+ 工具链）
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build
        env:
          VITE_ENV_NAME: production
          # vConsole 移动端调试面板：prod 默认启用（也可通过 ?vconsole 按需开启）
          VITE_ENABLE_VCONSOLE: 'true'
          # 其他构建期变量可按需追加，例如：
          # VITE_TCC_APP_ID: ${{ secrets.VITE_TCC_APP_ID }}

      # setup-vp / vp 不把裸 pnpm 放到 runner PATH（build 用 vp 内置 pnpm），
      # 而 wrangler-action 需要一个裸 package manager：npm 会因 package.json 的
      # devEngines.packageManager=pnpm 触发 EBADDEVENGINES 失败。用 corepack（node 自带）
      # 激活 pnpm，使 wrangler-action 按 pnpm-lock.yaml 推断出的 pnpm 可用。
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm --version

      - name: Deploy to Cloudflare Workers
        # 必须从仓库根目录部署：Nitro 构建时生成 .wrangler/deploy/config.json
        # 指向 .output/server/wrangler.json，wrangler 在根目录自动发现并解析
        # （若从 .output/server 运行会与 wrangler.json 冲突报错）
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # wrangler.json 无此字段，必须显式传
          command: deploy
          wranglerVersion: '4.124.0' # 与本地 catalog 版本一致，避免行为漂移
